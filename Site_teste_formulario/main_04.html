<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Meu primeiro formulário</title>
    </head>

    <body>
        <form action="base_de_dados_main_04" method="GET">
            <fieldset>
            <legend>Exemplo de Formulário</legend>
                <p>
                <label>Nome:</label>
                <input type="text" name="nome" placeholder="Digite seu nome" required>
                <br>
                <label>Sobrenome:</label>
                <input type="text" name="sobrenome" placeholder="Digite seu sobrenome" required>
                <br>
                <br><label>Sexo:</label><br>
                <input type="radio" value="Masculino" name="sexo" required>Masculino<br>
                <input type="radio" value="Feminino" name="sexo" required>Feminino<br>
                <br><label>Login:</label>
                <input type="text" name="login" placeholder="Digite seu login" required><br>
                <label>Senha:</label>
                <input type="password" name="senha" placeholder="Digite sua senha" required>
                <br>
                <br><label>Onde estuda:</label><br>
                <input type="checkbox" value="UEPA_CAMPUS_XX" name="onde_estuda" required>UEPA Campus XX<br>
                <input type="checkbox" value="UEPA_CAMPUS_XIX" name="onde_estuda" required>UEPA Campus XIX<br>
                <input type="checkbox" value="UEPA_CAMPUS_XVIII" name="onde_estuda" required>UEPA Campus VIII<br>
                <input type="checkbox" value="Outras" name="onde_estuda" required>Outras<br>
                <br>
                <label>Cidades de Moradia:</label>
                <select>
                  <option>Castanhal</option>
                  <option>Santa Izabel</option>
                  <option>Igarapé-Açu</option>
                </select>
                <br>
                <br>Observações<br>
                <textarea name="observacoes" rows="4" cols="20"></textarea><br>
                <button type="submit">Enviar</button>
                <button type="reset">Limpar</button>
                </p>
            </fieldset>
        </form>
    </body>
</html>
